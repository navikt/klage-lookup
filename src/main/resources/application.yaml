spring:
  application:
    name: klage-lookup
  web:
    error:
      include-message: never
      include-stacktrace: never
  data:
    redis:
      host: ${VALKEY_HOST_LOOKUP}
      port: ${VALKEY_PORT_LOOKUP}
      password: ${VALKEY_PASSWORD_LOOKUP}
      username: ${VALKEY_USERNAME_LOOKUP}
      ssl:
        enabled: true

management:
  endpoint:
    health:
      show-details: never
  endpoints.web:
    exposure:
      include: info, health, metrics, prometheus
    base-path: "/internal"
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8080

TILGANGSMASKINEN_BASE_URL: http://populasjonstilgangskontroll.tilgangsmaskin
ENTRA_PROXY_BASE_URL: http://entra-proxy.sikkerhetstjenesten
MICROSOFT_GRAPH_URL: https://graph.microsoft.com/v1.0
SKJERMING_BASE_URL: http://skjermede-personer-pip.nom
KABAL_API_BASE_URL: http://kabal-api
REPR_API_BASE_URL: http://repr-api.repr

SKJERMEDE_PERSONER_KAFKA_TOPIC: nom.skjermede-personer-v1
LEESAH_KAFKA_TOPIC: pdl.leesah-v1

STANDARD_TTL_SECONDS: 600
BEHANDLINGSNUMMER: B392
